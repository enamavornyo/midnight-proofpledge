version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 20
    labels:
      - dependencies
      - npm
    versioning-strategy: auto

    groups:
      midnight:
        patterns:
          - "@midnight-ntwrk/*"
      frontend:
        patterns:
          - "react"
          - "react-dom"
          - "react-router-dom"
          - "@types/react"
          - "@types/react-dom"
          - "@mui/*"
          - "@emotion/*"
      tooling:
        patterns:
          - "vite"
          - "vite-*"
          - "@vitejs/*"
          - "eslint"
          - "eslint-*"
          - "@typescript-eslint/*"
          - "typescript-eslint"
          - "typescript"
          - "prettier"
          - "vitest"
